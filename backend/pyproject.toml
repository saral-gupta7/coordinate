[project]
name = "backend"
version = "0.1.0"
description = "AI-native adaptive learning backend for Coordinate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "langchain[google-genai]>=1.3.4",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.2.4",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=6.0.0",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
